name: Test App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Test imports
      run: |
        python -c "import streamlit; import pandas; import numpy; import sklearn; print('✓ All imports successful')"
    
    - name: Test app syntax
      run: |
        python -c "import ast; ast.parse(open('app.py').read()); print('✓ App syntax valid')"
    
    - name: Check required files
      run: |
        test -f app.py || exit 1
        test -f requirements.txt || exit 1
        test -f .streamlit/config.toml || exit 1
        echo "✓ All required files present"